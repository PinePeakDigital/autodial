version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/functions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
