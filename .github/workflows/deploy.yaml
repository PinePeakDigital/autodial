name: Deploy
on:
  push:
    branches:
      - master
jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install function dependencies
        run: npm ci
        working-directory: ./functions
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: ./functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # react-scripts 4 / webpack 4 needs the legacy OpenSSL provider on Node 17+
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_APP_URL: ${{ secrets.REACT_APP_APP_URL }}
          REACT_APP_BM_CLIENT_ID: ${{ secrets.REACT_APP_BM_CLIENT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy build --project-name autodial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
