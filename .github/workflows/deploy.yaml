name: Deploy
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm ci
      - name: Install function dependencies
        run: npm ci
        working-directory: ./functions
      - name: Build SPA
        run: npm run build
        env:
          # react-scripts 4 / webpack 4 needs the legacy OpenSSL provider on Node 17+
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
          # Same-origin: the Worker serves the SPA, so the API is reached at /update etc.
          REACT_APP_API_URL: ""
          REACT_APP_APP_URL: ${{ secrets.REACT_APP_APP_URL }}
          REACT_APP_BM_CLIENT_ID: ${{ secrets.REACT_APP_BM_CLIENT_ID }}
      - name: Deploy Worker (SPA assets + API + cron)
        run: npx wrangler deploy
        working-directory: ./functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
